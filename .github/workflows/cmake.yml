name: Engine Simulator - Windows

'on':
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          choco install winflexbison3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $packages = @(
            'boost-filesystem:x64-windows-static-md'
            'sdl2:x64-windows'
            'sdl2-image:x64-windows'
            'vulkan-loader:x64-windows'
          )
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CMake
        run: |
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed'
          $env:SDL2DIR = Join-Path $installed 'x64-windows'
          $env:SDL2IMAGEDIR = $env:SDL2DIR
          $boost = Join-Path $installed 'x64-windows-static-md'
          $flex = (Get-Command win_flex.exe -ErrorAction Stop).Source
          $bison = (Get-Command win_bison.exe -ErrorAction Stop).Source
          $options = @(
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
            '-DCMAKE_POLICY_DEFAULT_CMP0167=OLD'
            "-DCMAKE_PREFIX_PATH=$boost"
            "-DFLEX_EXECUTABLE=$flex"
            "-DBISON_EXECUTABLE=$bison"
            '-DDISCORD_ENABLED=OFF'
          )
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 @options

      - name: Build engine-sim-app
        run: cmake --build build --config Release --target engine-sim-app --parallel

      - name: Prepare Windows package
        run: |
          $package = 'package'
          $bin = Join-Path $package 'bin'
          $delta = 'dependencies/submodules/delta-studio'
          $deltaAssets = Join-Path $package 'delta'
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/bin'

          New-Item -ItemType Directory -Path $bin, $deltaAssets | Out-Null
          Copy-Item 'build/Release/engine-sim-app.exe' $bin
          Copy-Item "$vcpkgBin/*.dll" $bin
          Copy-Item 'assets', 'es' $package -Recurse
          Copy-Item "$delta/engines/basic/fonts", "$delta/engines/basic/shaders" $deltaAssets -Recurse
          Copy-Item 'LICENSE' $package

          nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory legacy-directx -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $directX = 'legacy-directx/Microsoft.DXSDK.D3DX.9.29.952.8/build/native/release/bin/x64'
          Copy-Item "$directX/*.dll" $bin

          Set-Content "$bin/delta.conf" @('../delta', '../assets') -Encoding ascii
          Set-Content "$package/Lancer.cmd" @(
            '@echo off'
            'cd /d "%~dp0bin"'
            'start "" "engine-sim-app.exe"'
          ) -Encoding ascii

          foreach ($file in @('SDL2.dll', 'SDL2_image.dll', 'vulkan-1.dll', 'd3dx11_43.dll')) {
            if (-not (Test-Path (Join-Path $bin $file))) {
              throw "Missing runtime dependency: $file"
            }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: engine-sim-windows-x64
          path: package/
          if-no-files-found: error
